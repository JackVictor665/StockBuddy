<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up / StockBuddy</title><link rel="stylesheet" href="{{ url_for('static', path='custom.css') }}"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"></head>
<body class="auth-body"><main class="auth-card"><a href="/" class="brand auth-brand"><img class="brand-logo" src="{{ url_for('resources', path='Logo.png') }}" alt="StockBuddy logo"><span>stockbuddy</span></a><span class="eyebrow">NEW WORKSPACE USER</span><h1>Create account.</h1><p class="lede">Set up access to the inventory workspace.</p>{% if error %}<div class="form-error">{{ error }}</div>{% endif %}<form method="post" action="/signup" class="auth-form"><label>Username<input type="text" name="username" autocomplete="username" minlength="3" required></label><label>Password<input type="password" name="password" autocomplete="new-password" minlength="6" required></label><label>Confirm password<input type="password" name="confirm_password" autocomplete="new-password" minlength="6" required></label><button class="button" type="submit">CREATE ACCOUNT ↗</button></form><p class="auth-switch">Already registered? <a href="/login">Log in</a></p></main></body></html>
