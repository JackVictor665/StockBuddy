<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in / StockBuddy</title><link rel="stylesheet" href="{{ url_for('static', path='custom.css') }}"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"></head>
<body class="auth-body"><main class="auth-card"><a href="/" class="brand auth-brand"><img class="brand-logo" src="{{ url_for('resources', path='Logo.png') }}" alt="StockBuddy logo"><span>stockbuddy</span></a><span class="eyebrow">SECURE WORKSPACE</span><h1>Welcome back.</h1><p class="lede">Log in to manage your hardware floor.</p>{% if error %}<div class="form-error">{{ error }}</div>{% endif %}<form method="post" action="/login" class="auth-form"><input type="hidden" name="next_url" value="{{ request.query_params.get('next', '/') }}"><label>Username<input type="text" name="username" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="button" type="submit">LOG IN ↗</button></form><p class="auth-switch">New to StockBuddy? <a href="/signup">Create an account</a></p></main></body></html>
