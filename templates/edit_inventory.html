{% extends 'base.html' %}{% block title %}Edit Inventory{% endblock %}{% block
heading %}Edit hardware{% endblock %}{% block content %}
<div class="intro-row">
  <p class="lede">Update the component record and its stock controls.</p>
  <a class="text-link" href="/inventory">← Back to inventory</a>
</div>
<section class="panel form-panel">
  <div class="panel-head">
    <div>
      <span class="eyebrow">EDIT RECORD / {{ product.sku }}</span>
      <h2>{{ product.name }}</h2>
    </div>
  </div>
  <form
    method="post"
    action="/inventory/{{ product.id }}/edit"
    class="form-grid"
  >
    <input
      name="name"
      value="{{ product.name }}"
      placeholder="Product name"
      required
    /><input
      name="sku"
      value="{{ product.sku }}"
      placeholder="SKU"
      required
    /><select name="category">
      {% for category in ['GPU', 'CPU', 'RAM', 'Storage', 'PSU'] %}
      <option {% if product.category == category %}selected{% endif %}>
        {{ category }}
      </option>
      {% endfor %}</select
    ><input
      name="cost_price"
      type="number"
      step="0.01"
      value="{{ product.cost_price }}"
      placeholder="Wholesale cost"
      required
    /><input
      name="selling_price"
      type="number"
      step="0.01"
      value="{{ product.selling_price }}"
      placeholder="Selling price"
      required
    /><input
      name="current_stock"
      type="number"
      value="{{ product.current_stock }}"
      placeholder="Current stock"
      required
    /><input
      name="min_stock_alert"
      type="number"
      value="{{ product.min_stock_alert }}"
      placeholder="Minimum alert"
      required
    /><input
      name="lead_time_days"
      type="number"
      value="{{ product.lead_time_days }}"
      placeholder="Lead time (days)"
      required
    /><button class="button" type="submit">UPDATE COMPONENT ↗</button>
  </form>
</section>
{% endblock %}
